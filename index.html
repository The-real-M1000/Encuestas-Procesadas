<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>galeria — terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0809; --panel:#150d0e; --line:#3a1a1c; --red:#ff4b4b; --dim:#a8393b; --faint:#6b2a2c;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{margin:0;background:var(--bg);color:var(--red);font:400 14px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  background-image:repeating-linear-gradient(0deg,rgba(255,75,75,.025) 0 1px,transparent 1px 3px);min-height:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--red);outline-offset:3px}
::selection{background:var(--red);color:var(--bg)}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(13,8,9,.92);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:14px clamp(14px,4vw,40px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:6}
.bar{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.prompt{margin:0;font-size:clamp(13px,3.6vw,15px);font-weight:500}
.prompt .dim{color:var(--dim)}
.cursor{display:inline-block;width:.6em;height:1.1em;background:var(--red);vertical-align:-.2em;margin-left:2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--faint);padding:7px 12px;min-height:38px;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--red);color:var(--bg);border-color:var(--red)}

main{max-width:1200px;margin:0 auto;padding:22px clamp(14px,4vw,40px) 60px}
.meta{color:var(--dim);margin:0 0 18px;font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:14px}
.item{background:none;border:0;padding:0;text-align:left}
.thumb{display:block;aspect-ratio:4/3;border:1px solid var(--line);background:var(--panel);overflow:hidden;transition:border-color .15s}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.85);transition:filter .2s}
.item:hover .thumb,.item:focus-visible .thumb{border-color:var(--red)}
.item:hover img{filter:none}
.name{display:block;margin-top:6px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item:hover .name{color:var(--red)}
footer{border-top:1px solid var(--line);padding:16px;text-align:center;color:var(--faint);font-size:12px}

/* visor */
#viewer{position:fixed;inset:0;z-index:20;background:rgba(8,4,5,.97);display:none;flex-direction:column;
  padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#viewer.open{display:flex}
.vtop,.vbot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px clamp(12px,3vw,28px);font-size:13px}
.vtop{border-bottom:1px solid var(--line)}
.vbot{border-top:1px solid var(--line);color:var(--dim)}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:12px 56px;touch-action:pan-y}
.stage img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--line);background:var(--panel)}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;background:transparent;border:1px solid var(--faint);font-size:20px}
.nav:hover{background:var(--red);color:var(--bg)}
.prev{left:6px}.next{right:6px}
.hint{color:var(--faint)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--panel);
  border:1px solid var(--red);padding:8px 14px;z-index:30;display:none;max-width:90vw;font-size:13px}
@media (max-width:560px){
  .stage{padding:8px 8px}
  .nav{width:40px;height:52px;top:auto;bottom:10px;transform:none;background:rgba(13,8,9,.85)}
  .prev{left:10px}.next{right:10px}
  .hint{display:none}
  .actions{width:100%}.actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){.cursor{animation:none}*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="bar">
    <p class="prompt"><span class="dim">Jatdiel Mideros/Personero</span>:~/galeria$ ls<span class="cursor" aria-hidden="true"></span></p>
    <div class="actions">
      <button class="btn" id="shuffle" type="button">[ shuffle ]</button>
      <button class="btn" id="excel" type="button">[ descargar excel ]</button>
    </div>
  </div>
</header>

<main>
  <p class="meta" id="meta"></p>
  <div class="grid" id="grid"></div>
</main>
<footer>fin del listado</footer>

<div id="viewer" role="dialog" aria-modal="true" aria-label="Visor de imágenes">
  <div class="vtop"><span id="vname"></span><button class="btn" id="close" type="button" aria-label="Cerrar visor">[ cerrar ]</button></div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev" type="button" aria-label="Imagen anterior">&lt;</button>
    <img id="vimg" alt="">
    <button class="nav next" id="next" type="button" aria-label="Imagen siguiente">&gt;</button>
  </div>
  <div class="vbot"><span id="vcount"></span><span class="hint">← → navegar · r aleatoria · esc cerrar</span></div>
</div>
<div id="toast" role="status"></div>

<script>
/* ===== CONFIGURACIÓN ===== */
const CONFIG = {
  user: "The-real-M1000",
  repo: "Encuestas-Procesadas",
  branch: "main",
  folder: "",                       // "" = todo el repo; o una subcarpeta, ej: "imagenes"
  exts: /\.(jpe?g|png|webp|gif|avif)$/i
};
/* ========================= */

const $ = id => document.getElementById(id);
const grid = $("grid"), viewer = $("viewer"), vimg = $("vimg"), meta = $("meta");
let files = [], excelFile = null, current = 1, lastFocus = null;
const total = () => files.length;
const src = n => files[n - 1].url;
const fname = n => files[n - 1].path;

const rawUrl = p => `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/` +
  p.split("/").map(encodeURIComponent).join("/");

async function loadTree(){
  const key = `tree:${CONFIG.user}/${CONFIG.repo}@${CONFIG.branch}`;
  try { const c = sessionStorage.getItem(key); if(c) return JSON.parse(c); } catch(e){}
  const r = await fetch(`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`);
  if(!r.ok) throw new Error("GitHub API " + r.status);
  const j = await r.json();
  const paths = j.tree.filter(t => t.type === "blob").map(t => t.path);
  try { sessionStorage.setItem(key, JSON.stringify(paths)); } catch(e){}
  return paths;
}

async function init(){
  meta.textContent = "cargando listado desde github…";
  try {
    const prefix = CONFIG.folder ? CONFIG.folder.replace(/\/$/,"") + "/" : "";
    const paths = (await loadTree()).filter(p => p.startsWith(prefix));
    const collator = new Intl.Collator("es", {numeric:true});
    files = paths.filter(p => CONFIG.exts.test(p)).sort(collator.compare)
      .map(p => ({ path: p.slice(prefix.length), url: rawUrl(p) }));
    const x = paths.find(p => /\.xlsx?$/i.test(p));
    excelFile = x ? { path: x, url: rawUrl(x) } : null;
  } catch(err){
    meta.textContent = "error al leer el repo (" + err.message + "). Si es el límite de la API, espera unos minutos y recarga.";
    return;
  }
  if(!files.length){ meta.textContent = "no se encontraron imágenes en el repo"; return; }
  meta.textContent = files.length + " archivos · origen: La voz de los estudiantes";
  for(let n = 1; n <= total(); n++){
    const b = document.createElement("button");
    b.className = "item"; b.type = "button";
    b.setAttribute("aria-label", "Abrir " + fname(n));
    const t = document.createElement("span"); t.className = "thumb";
    const im = document.createElement("img");
    im.loading = "lazy"; im.decoding = "async"; im.alt = ""; im.src = src(n);
    t.appendChild(im);
    const nm = document.createElement("span"); nm.className = "name"; nm.textContent = fname(n);
    b.append(t, nm);
    b.addEventListener("click", () => open(n));
    grid.appendChild(b);
  }
}

function show(n){
  const T = total();
  current = ((n - 1 + T) % T) + 1;
  vimg.src = src(current);
  vimg.alt = fname(current);
  $("vname").textContent = "> " + fname(current);
  $("vcount").textContent = String(current).padStart(3,"0") + " / " + T;
  [current + 1, current - 1].forEach(m => { const i = new Image(); i.src = src(((m - 1 + T) % T) + 1); });
}
function open(n){
  if(!total()) return;
  lastFocus = document.activeElement;
  viewer.classList.add("open"); document.body.style.overflow = "hidden";
  show(n); $("close").focus();
}
function close(){
  viewer.classList.remove("open"); document.body.style.overflow = "";
  if(lastFocus) lastFocus.focus();
}
function random(){
  const T = total(); if(!T) return;
  let n; do { n = 1 + Math.floor(Math.random() * T); } while(n === current && T > 1);
  viewer.classList.contains("open") ? show(n) : open(n);
}
function toast(msg){
  const t = $("toast"); t.textContent = msg; t.style.display = "block";
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", 3200);
}

$("shuffle").addEventListener("click", random);
$("close").addEventListener("click", close);
$("prev").addEventListener("click", () => show(current - 1));
$("next").addEventListener("click", () => show(current + 1));
$("excel").addEventListener("click", async () => {
  if(!excelFile){ toast("No hay ningún .xlsx en el repo"); return; }
  try {
    const r = await fetch(excelFile.url); if(!r.ok) throw 0;
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href = url; a.download = excelFile.path.split("/").pop(); a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  } catch(e){ window.open(excelFile.url, "_blank"); }
});
$("stage").addEventListener("click", e => { if(e.target === $("stage")) close(); });

document.addEventListener("keydown", e => {
  if(!viewer.classList.contains("open")) return;
  if(e.key === "ArrowRight") show(current + 1);
  else if(e.key === "ArrowLeft") show(current - 1);
  else if(e.key === "Escape") close();
  else if(e.key.toLowerCase() === "r") random();
});

let x0 = null;
$("stage").addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, {passive:true});
$("stage").addEventListener("touchend", e => {
  if(x0 === null) return;
  const dx = e.changedTouches[0].clientX - x0; x0 = null;
  if(Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
});

init();
</script>
</body>
</html>
